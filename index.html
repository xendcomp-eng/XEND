<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* view mode: auto | mobile | desktop (saved on this device) */
(function(){var K='xv-view',D=document.documentElement;
function get(){try{var v=localStorage.getItem(K);return v==='mobile'||v==='desktop'?v:'auto'}catch(e){return 'auto'}}
function eff(p){return p==='auto'?(window.innerWidth>=900?'desktop':'mobile'):p}
window.xvApply=function(p){p=p||get();
  var vp=document.getElementById('vp');
  if(vp)vp.setAttribute('content',p==='desktop'?'width=1100':'width=device-width, initial-scale=1, viewport-fit=cover');
  var e=eff(p);D.setAttribute('data-view',p);D.setAttribute('data-eff',e);
  var b=document.getElementById('vmode');
  if(b){var nm={auto:'Auto',mobile:'Mobile',desktop:'Desktop'}[p],ic=p==='auto'?(e==='desktop'?'\uD83D\uDDA5':'\uD83D\uDCF1'):(p==='mobile'?'\uD83D\uDCF1':'\uD83D\uDDA5');
    b.textContent=ic+' '+nm;b.title=(window.xvInfo?xvInfo.device+' '+xvInfo.width+'\u00D7'+xvInfo.height+' \u00B7 ':'')+'View mode: '+nm+(p==='auto'?' (fits your screen: '+e+'). Tap to force Mobile.':p==='mobile'?'. Tap to force Desktop.':'. Tap to go back to Auto.')}};
window.xvCycle=function(){var c=get(),n=c==='auto'?'mobile':c==='mobile'?'desktop':'auto';
  try{if(n==='auto')localStorage.removeItem(K);else localStorage.setItem(K,n)}catch(e){}
  window.xvApply(n)};
window.xvApply();
window.addEventListener('resize',function(){window.xvApply()});
window.addEventListener('orientationchange',function(){setTimeout(function(){window.xvApply()},250)});
})();
</script>
<meta name="theme-color" content="#111111">
<title>XEND-CASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --line: #e2e8f0;
  --fld: #cbd5e1;
  --edge: #e2e8f0;
  --acc: #ffc400;
  --onacc: #0f172a;
  --hdr: rgba(15, 23, 42, 0.88);
  --bad: #dc2626;
  --onbg: #0f172a;
  --onfg: #ffc400;
  --errbg: #fef2f2;
  --errfg: #991b1b;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 35px -10px rgba(15, 23, 42, 0.14);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --card: #121215;
    --ink: #f8fafc;
    --mut: #94a3b8;
    --line: #27272a;
    --fld: #3f3f46;
    --edge: #27272a;
    --acc: #ffc400;
    --onacc: #09090b;
    --hdr: rgba(9, 9, 11, 0.84);
    --bad: #f87171;
    --onbg: #ffc400;
    --onfg: #09090b;
    --errbg: #450a0a;
    --errfg: #fecaca;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  font-size: clamp(14px, 4.1vw, 16px);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font: .9375rem/1.55 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Floating Glass Header */
header {
  position: sticky;
  top: 0;
  z-index: 15;
  background: var(--hdr);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
  padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  transition: background 0.3s var(--ease);
}
.hin {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
header b {
  font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  color: var(--acc);
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  display: inline-flex;
  align-items: center;
}
header .mut {
  color: #cbd5e1;
  font-size: 0.8rem;
  background: rgba(255, 255, 255, 0.08);
  padding: 3px 10px;
  border-radius: 99px;
}
#who {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9rem;
  font-weight: 500;
}
header button {
  min-height: 36px;
  padding: 6px 14px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.16);
  font-size: 0.84rem;
  font-weight: 600;
}
header button:hover {
  background: rgba(255, 255, 255, 0.18);
}

/* Main Container */
main {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  animation: viewIn 0.38s var(--ease) both;
}
@keyframes viewIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

h1, h2 {
  font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  letter-spacing: -0.02em;
}
h2 {
  font-size: 1.15rem;
  font-weight: 700;
  margin: 0 0 12px;
}

/* Avatar / Photo */
.ph {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--edge);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  background: var(--card);
  flex: none;
  transition: transform 0.25s var(--ease);
}
.ph:hover {
  transform: scale(1.03);
}
.ph img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Modern Cards */
.card {
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
}
.card:has(.bal) {
  background: linear-gradient(135deg, var(--acc) 0%, color-mix(in srgb, var(--acc) 82%, #ff9500) 100%);
  color: var(--onacc);
  border: 1px solid rgba(0, 0, 0, 0.08);
  box-shadow: 0 14px 30px -8px color-mix(in srgb, var(--acc) 45%, transparent);
  position: relative;
  overflow: hidden;
}
.card:has(.bal) .mut {
  color: color-mix(in srgb, var(--onacc) 78%, transparent);
}
.bal {
  font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  font-size: 2.75rem;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin: 4px 0;
}
.mut {
  color: var(--mut);
  font-size: 0.88rem;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.sp {
  justify-content: space-between;
}

/* Tactile Controls & Buttons */
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button {
  background: var(--card);
  color: var(--ink);
  border: 1.5px solid var(--edge);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  min-height: 46px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.94rem;
  touch-action: manipulation;
  box-shadow: var(--shadow-sm);
  transition: transform 0.16s var(--ease), background-color 0.2s var(--ease), border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), opacity 0.2s var(--ease);
}
button:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--ink) 35%, var(--edge));
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
button:active:not(:disabled) {
  transform: scale(0.97);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
}
button.go {
  background: var(--acc);
  border-color: transparent;
  color: var(--onacc);
  font-weight: 700;
  box-shadow: 0 6px 16px -4px color-mix(in srgb, var(--acc) 55%, transparent);
}
button.go:hover:not(:disabled) {
  filter: brightness(1.04);
  box-shadow: 0 10px 22px -4px color-mix(in srgb, var(--acc) 65%, transparent);
}
button.on {
  background: var(--onbg);
  color: var(--onfg);
  border-color: var(--onbg);
}
button.bad {
  color: var(--bad);
  border: 1.5px dashed color-mix(in srgb, var(--bad) 55%, transparent);
  background: transparent;
  box-shadow: none;
}
button.bad:hover:not(:disabled) {
  background: color-mix(in srgb, var(--bad) 8%, transparent);
  border-color: var(--bad);
}
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--acc) 70%, var(--ink));
  outline-offset: 2px;
}

/* Sleek Form Inputs */
input, select, textarea {
  background: var(--bg);
  border: 1.5px solid var(--fld);
  border-radius: var(--radius-md);
  padding: 11px 14px;
  min-height: 46px;
  min-width: 0;
  max-width: 100%;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), background-color 0.2s var(--ease);
}
input:focus, select:focus, textarea:focus {
  background: var(--card);
  border-color: var(--ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 28%, transparent);
}
textarea {
  width: 100%;
  min-height: 92px;
  resize: vertical;
}

/* List Items & Alerts */
.item {
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.item:first-child {
  border-top: 0;
  padding-top: 4px;
}
.msg {
  border-radius: var(--radius-md);
  padding: 13px 16px;
  margin-bottom: 16px;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
  animation: viewIn 0.28s var(--ease) both;
}
.ok {
  background: var(--acc);
  color: var(--onacc);
  border: 1px solid rgba(0, 0, 0, 0.08);
}
.err {
  background: var(--errbg);
  color: var(--errfg);
  border: 1px solid color-mix(in srgb, var(--errfg) 25%, transparent);
}
.tag {
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  border: 1px solid var(--edge);
  border-radius: 99px;
  padding: 3px 11px;
  font-size: 0.78rem;
  font-weight: 700;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.tag.ok {
  background: color-mix(in srgb, var(--acc) 22%, var(--card));
  border-color: color-mix(in srgb, var(--acc) 60%, var(--edge));
  color: var(--ink);
}
mark {
  background: color-mix(in srgb, var(--acc) 45%, transparent);
  color: inherit;
  border-radius: 4px;
  padding: 0 2px;
  font-weight: 700;
}
.big {
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
td {
  padding: 10px 6px;
  border-top: 1px solid var(--line);
  vertical-align: top;
}
tr:hover td {
  background: color-mix(in srgb, var(--ink) 2.5%, transparent);
}
summary {
  cursor: pointer;
  font-weight: 700;
  min-height: 44px;
  display: flex;
  align-items: center;
  user-select: none;
}

/* Digital Business Card Links */
.lnk {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 10px;
  border-top: 1px solid var(--line);
  border-radius: var(--radius-md);
  color: inherit;
  text-decoration: none;
  min-height: 58px;
  transition: background-color 0.2s var(--ease), transform 0.18s var(--ease);
}
a.lnk:hover {
  background: color-mix(in srgb, var(--ink) 4%, transparent);
  transform: translateX(3px);
}
a.lnk:active {
  opacity: 0.7;
}
.ic {
  flex: 0 0 44px;
  height: 44px;
  border-radius: 50%;
  background: #0f172a;
  color: #ffc400;
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
a.ic:hover {
  transform: translateY(-2px) scale(1.06);
  box-shadow: var(--shadow-md);
}
.lk {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.lk:first-child {
  border-top: 0;
}
.lk input[type=text] {
  width: 100%;
  margin-top: 8px;
}
.tg {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tg span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
input[type=checkbox], input[type=radio] {
  width: 22px;
  height: 22px;
  min-height: 0;
  padding: 0;
  accent-color: #ffc400;
  cursor: pointer;
}

/* Segmented Controls & Navigation Tabs */
.seg {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  background: var(--bg);
  padding: 5px;
  border-radius: var(--radius-md);
  border: 1px solid var(--edge);
}
.seg button {
  flex: 1;
  padding: 9px 6px;
  min-height: 40px;
  border: 0;
  background: transparent;
  box-shadow: none;
  border-radius: var(--radius-sm);
}
.seg button.on {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
@media (prefers-color-scheme: dark) {
  .seg button.on {
    background: var(--acc);
    color: var(--onacc);
  }
}

.tabs {
  flex-wrap: nowrap;
  overflow-x: auto;
  padding: 4px 2px 8px;
  gap: 8px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar {
  display: none;
}
.tabs button {
  flex: 0 0 auto !important;
  padding: 9px 16px;
  min-height: 40px;
  border-radius: 99px;
  font-size: 0.88rem;
}

/* Modals & Popups */
#pop:empty {
  display: none;
}
#pop, #ordm, #cmpm {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(9, 9, 11, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeBg 0.24s var(--ease) both;
}
#pop {
  z-index: 30;
}
@keyframes fadeBg {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes sheetUp {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.popcard {
  background: var(--acc);
  color: var(--onacc);
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: var(--radius-xl);
  padding: 26px 22px;
  width: 100%;
  max-width: 390px;
  text-align: center;
  max-height: 90vh;
  overflow: auto;
  box-shadow: var(--shadow-lg);
  animation: sheetUp 0.32s var(--ease) both;
}
.popcard .bal {
  font-size: 3.2rem;
  margin: 8px 0;
}
#ordm .card {
  width: 100%;
  max-width: 440px;
  max-height: 92vh;
  overflow: auto;
  margin: 0;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  animation: sheetUp 0.32s var(--ease) both;
}
#ordm input, #ordm select {
  width: 100%;
}
#cmpm .card {
  width: 100%;
  max-width: 800px;
  max-height: 92vh;
  overflow: auto;
  margin: 0;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  animation: sheetUp 0.32s var(--ease) both;
}

/* Mobile Responsive Bottom Sheets & Forms */
@media (max-width: 560px) {
  .row input, .row select {
    width: 100% !important;
    flex: 1 1 100% !important;
  }
  .row:not(.sp) button {
    flex: 1 1 auto;
  }
  .card {
    padding: 16px;
    border-radius: var(--radius-md);
  }
  #pop, #ordm, #cmpm {
    align-items: flex-end;
    padding: 0;
  }
  .popcard, #ordm .card, #cmpm .card {
    max-width: 100%;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
}

/* Floating Toast */
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom));
  z-index: 35;
  max-width: 92%;
  padding: 12px 20px;
  border-radius: 99px;
  font-weight: 600;
  font-size: 0.92rem;
  background: var(--acc);
  color: var(--onacc);
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.28s var(--ease) both;
}
#toast.err {
  background: #0f172a;
  color: #fff;
  border: 1px solid rgba(255, 196, 0, 0.4);
}
#toast:empty {
  display: none;
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 14px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* NFC Pulse Ring */
.pulse {
  width: 96px;
  height: 96px;
  margin: 14px auto;
  border-radius: 50%;
  background: #0f172a;
  color: #ffc400;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  animation: pls 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}
@keyframes pls {
  0% { box-shadow: 0 0 0 0 rgba(15, 23, 42, 0.5); }
  100% { box-shadow: 0 0 0 40px rgba(15, 23, 42, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .pulse, .anim-fade-in, .anim-slide-up, .anim-pulse, main, .popcard, #ordm .card, #cmpm .card {
    animation: none !important;
  }
}

/* Chat & Friends */
.av {
  flex: 0 0 44px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: #0f172a;
  border: 1.5px solid rgba(0, 0, 0, 0.08);
  box-shadow: var(--shadow-sm);
}
button.frow {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 62px;
  padding: 10px 6px;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  text-align: left;
  font-weight: 400;
}
button.frow:hover {
  background: color-mix(in srgb, var(--ink) 3%, transparent);
  transform: none;
  box-shadow: none;
}
.dot {
  background: #ef4444;
  color: #fff;
  border-radius: 99px;
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Live Snaps Fullscreen Camera & Viewer */
#snapcam, #snapv {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: #000;
  color: #fff;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
#snapv {
  z-index: 50;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.sv-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
}
.sv-top button, #snapcam .sv-top button {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.25);
  border-radius: 99px;
}
.sv-stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;

      var k=tokenFrom(t),sn=k?null:serialFrom(t);if(pairing){pair(e.serialNumber)}else if(sn)onSerial(sn);else onKey(k||e.serialNumber)};
    r.onreadingerror=function(){say('Could not read that tag. Hold it steady and try again.',false);render()};
    render();
  }catch(e){nfcOn=false;scanCtl=null;say('NFC could not start: '+e.message+'. Turn NFC on and allow the permission.',false);render()}
}

function hrefOf(t,v){v=String(v||'').trim();if(!v)return null;
  var url=/^https?:\/\//i.test(v);

  (c.links||[]).forEach(function(l){var val=vc(l.v),h=hrefOf(l.t,l.v);if(!l.on||!val)return;
    if(l.t==='photo'){if(okImg(l.v))v+='PHOTO;ENCODING=b;TYPE=JPEG:'+l.v.split(',')[1]+'\n';return}
    if(l.t==='title')v+='TITLE:'+val+'\n';else if(l.t==='bio')v+='NOTE:'+val+'\n';else if(l.t==='phone'||l.t==='whatsapp')v+='TEL:'+val+'\n';else if(l.t==='email')v+='EMAIL:'+val+'\n';else if(h&&/^https?:/.test(h))v+='URL:'+h+'\n'});
  v+='END:VCARD';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=c.name.replace(/\W+/g,'_')+'.vcf';a.click()}

var THEME_KEYS=[['bg','Page background'],['card','Cards'],['ink','Text'],['mut','Soft text'],['line','Divider lines'],['edge','Borders'],['acc','Accent (yellow buttons and balance card)'],['onacc','Text on accent'],['hdr','Top bar']];

  '@media (prefers-color-scheme:dark){:root{'+d('dark')+'--onbg:var(--acc);--onfg:var(--onacc)}}'+
  'header{background:var(--hdr)}.ic{background:var(--hdr);color:var(--acc)}button.go,.ok,.xban,.popcard,#toast,.card:has(.bal){color:var(--onacc)}'}
function themeApply(t){var c=themeCss(t);if(c===themeLast)return;themeLast=c;
  var s=$('xtheme');if(!s){s=document.createElement('style');s.id='xtheme';document.head.appendChild(s)}s.textContent=c;

      fin(recs.length?{text:t.trim(),serial:serialFrom(t),token:tokenFrom(t)}:null)};
    r.onreadingerror=function(){fin(null)}}).catch(function(){fin(null)})})}

var qrT=null,qrEnd=0,qrMode='key',qrTok=null,qrBusy=false;
function qrOk(t){return /^[0-9a-f]{32}$/i.test(String(t||''))}
function qrStop(){if(qrT){clearInterval(qrT);qrT=null}}
function qrClose(){qrStop();var p=$('pop');if(p&&p.dataset.qr){delete p.dataset.qr;p.innerHTML=''}}
/* mode 'login' asks for username + PIN; otherwise only the PIN (this phone's guest, or the bracelet that was just tapped) */
function qrOpen(mode){
  var p=$('pop');if(!p)return;
  var gs=ld('fb-guest'),tok=gs&&qrOk(gs.k)?gs.k:(qrOk(key)?key:null);
  qrMode=(mode==='login'||!tok)?'login':'key';qrTok=qrMode==='key'?tok:null;
  qrStop();p.dataset.qr='1';
  p.innerHTML='<div class="popcard" role="dialog" aria-label="Show my QR"><div style="font-weight:700">\uD83D\uDCF1 Show my QR</div>'+
    '<p style="margin:8px 0 12px">For friends whose phone has no NFC. Enter your '+(qrMode==='login'?'username and ':'')+'PIN to show a QR that opens your business card.</p>'+
    (qrMode==='login'?'<input id="qru" placeholder="Username" autocapitalize="none" autocomplete="username" style="width:100%;margin-bottom:8px">':'')+
    '<input id="qrp" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password" style="width:100%" onkeydown="if(event.key===\'Enter\')qrReveal()">'+
    '<div id="qre" role="status" style="min-height:1.3em;margin:8px 0;font-weight:600"></div>'+
    '<button onclick="qrReveal()" style="width:100%;background:#111;color:#ffc400;border-color:#111">Show QR</button>'+
    '<button onclick="qrClose()" style="width:100%;margin-top:8px">Cancel</button></div>';
  setTimeout(function(){var e=$(qrMode==='login'?'qru':'qrp');if(e)e.focus()},50)}
async function qrReveal(){
  if(qrBusy)return;
  var pe=$('qrp'),ue=$('qru'),er=$('qre'),pin=pe?pe.value.trim():'',un=ue?ue.value.trim():'';
  if(!pin||(qrMode==='login'&&!un)){if(er)er.textContent=qrMode==='login'?'Enter your username and PIN.':'Enter your PIN.';return}
  qrBusy=true;if(er)er.textContent='Checking\u2026';
  try{
    var tok=qrTok;
    if(qrMode==='login'){
      var r;try{r=await rpc('claim_login',{n:un,pin_:pin})}catch(e){if(/claim_login|schema cache|Could not find/i.test(e.message))r=await rpc('guest_login',{n:un,pin_:pin});else throw e}
      if(!r||!r.ok)throw new Error((r&&r.text)||'Wrong username or PIN.');
      tok=r.token}
    var w=await rpc('wallet',{k:tok,pin_:pin});
    if(!w)throw new Error('Wrong PIN.');

  var w=document.querySelector('.xpb i.w');if(w)w.className='a';xVT=setTimeout(xVNext,5000)}

vChat=function(){var conv=chatView==='conv',act=conv?(chatTo?'friends':'bcast'):cTab,uf=0,seen=false;chatPeople.forEach(function(p){uf+=unreadN(p.id)});

    ((fr&&feat('gifts'))||(fr&&mw!==false)?'<div class="xact">'+(feat('gifts')?'<button onclick="xGoGift()">\uD83C\uDF81 Gift tokens</button>':'')+(mw!==false?'<button onclick="xGoMoney()">\uD83D\uDCB8 Send money</button>':'')+'</div>':'')+
    '<div id="xemo" class="xemo" style="display:none">'+EMO.map(function(e){return '<button onclick="chatEmoji(\''+e+'\')">'+e+'</button>'}).join('')+'</div>'+

    '<div id="cbox" class="xcomp">'+(fr?'<button class="xic" onclick="snapCam()" aria-label="Send a snap">'+XSVG.cam+'</button>':'')+'<button class="xic" onclick="chatSend(true)" aria-label="Share my location">'+XSVG.pin+'</button><input id="ctxt" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="Message" onkeydown="if(event.key===\'Enter\')xSK()"><button class="xic" onclick="xEmo()" aria-label="Emoji">\uD83D\uDE0A</button>'+
    '<button id="xsend" class="xsendb" aria-label="Send. Press and hold, then slide up to choose how long it stays" onpointerdown="xSD(event)" onpointermove="xSM(event)" onpointerup="xSU(event)" onpointercancel="xSC()" oncontextmenu="return false" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();xSK()}">'+XSVG.send+'</button></div>'+
