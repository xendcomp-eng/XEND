}

<body>
<header><div class="hin"><b>XEND-CASH</b><span class="mut" id="nfc"></span><button id="bell" onclick="bellTap()" aria-label="Alerts"></button><span id="who"></span></div></header>
<main>
<div id="msg"></div><div id="view"></div>
</main>
<p class="mut" style="text-align:center;font-size:.75rem;margin:0 0 24px">Version: 11 Nov 2026 · token sources + Paystack payouts</p>
<div id="pop"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* PUT YOUR SUPABASE DETAILS HERE (between the quotes). Leave empty to use the setup screen instead. */
var MAILDOM='xendcash.app',cdirty=false,editG=null,lmode=ld('fb-lmode')||'guest',vs=null,vtimer=null,lastSale=null,popItems=[];
var DEFAULT_CFG={url:'https://lczfcbjnafaknxlkqlbs.supabase.co',key:'sb_publishable_pyjdDTRequIqNNw8L_om0w_mYkvcOL1'};
var cfg=(DEFAULT_CFG.url&&DEFAULT_CFG.key)?DEFAULT_CFG:ld('fb-cfg'),armed=ld('fb-armed'),sb=null,me=null,key=null,card=null,scanInfo=null,wallet=null,wmode=null,wpin='',tab='till',last=null,flash=null,nfcOn=false,pairing=null,busy=false,adm={guests:[],tx:[],vendors:[],staff:[],events:[],buys:[]},evSel='',closeSum=null;
var HAS=('NDEFReader' in window),scanCtl=null,writeCtl=null;
function say(t,ok){flash={t:t,ok:ok}}
async function rpc(n,a){if(/^(chat_send|gift_send|chat_snap_open|chat_snap_put|chat_snap_redeem)$/.test(n))ownAt=Date.now();var r=await sb.rpc(n,a||{});if(r.error)throw new Error(r.error.message);return r.data}
function tokenFrom(s){var m=String(s||'').match(/[#?&\/]b[=\/]([0-9a-f]{32})/i)||String(s||'').match(/\b([0-9a-f]{32})\b/i);return m?m[1].toLowerCase():null}
function serialFrom(s){var m=String(s||'').match(/[#?&]s=([A-Za-z0-9][A-Za-z0-9_-]{3,39})(?![A-Za-z0-9_-])/);return m?m[1].toUpperCase():null}
function base(){return location.href.split('#')[0].split('?')[0]}
function clearArm(){armed=null;sv('fb-armed',null)}

async function boot(){
  payCapture();
  if(cfg){sb=supabase.createClient(cfg.url,cfg.key);try{FX=await rpc('cfg_get')||FX}catch(e){}var s=(await sb.auth.getSession()).data.session;if(s)await loadMe();
    var fm=String(location.hash||'').match(/[#&]f=([0-9a-f]{6})/i);if(fm){try{history.replaceState(null,'',location.pathname)}catch(e){}await friendLink(fm[1].toUpperCase());return}
    var sn=serialFrom(location.hash||location.search);if(sn){try{history.replaceState(null,'',location.pathname)}catch(e){}await onSerial(sn);return}
    var t=tokenFrom(location.hash||location.search);if(t){try{history.replaceState(null,'',location.pathname)}catch(e){}await onKey(t);return}
    if(!me){var gs=ld('fb-guest');if(gs){try{key=gs.k;wpin=gs.pin;wallet=await rpc('wallet',{k:gs.k,pin_:gs.pin});if(wallet)wmode='open';else{key=null;sv('fb-guest',null)}}catch(e){key=null}}}}
  render();
}
async function loadMe(){try{me=await rpc('me')}catch(e){me=null}try{caps=me&&me.role==='organizer'?await rpc('my_caps'):null}catch(e){caps=null}if(me&&me.role!=='vendor')tab='top';if(me&&me.role==='vendor')startSales()}
function loginEmail(){var e=$('em').value.trim();return e.indexOf('@')<0?e.toLowerCase()+'@'+MAILDOM:e}
async function login(kind){try{var r=await sb.auth.signInWithPassword({email:loginEmail(),password:$('pw').value});if(r.error)throw r.error;await loadMe();
    if(!me)await wrongDoor('This account has no role yet. Ask an admin.');
    else if(kind==='vendor'&&me.role!=='vendor')await wrongDoor('This is an admin or staff account. Use Admin / Staff login.');
    else if(kind==='staff'&&me.role==='vendor')await wrongDoor('This is a vendor account. Use Vendor login.');
    else say('Welcome, '+me.name+'.',true)}
  catch(e){say(/invalid/i.test(e.message)?'Wrong username or password.':e.message,false)}render()}
async function wrongDoor(t){stopSales();await sb.auth.signOut();me=null;vs=null;lastSale=null;say(t,false)}
function setL(m){lmode=m;sv('fb-lmode',m);render()}
function roleLabel(r){return r==='vendor'?'Vendor':r==='organizer'?'Staff':'Admin'}
async function logout(){stopSales();vs=null;lastSale=null;closePop();await sb.auth.signOut();me=null;clearArm();last=null;scanInfo=null;say('Logged out.',true);render()}

/* ---- a bracelet was tapped (real NFC or opened link) ---- */
async function onKey(k){
  if(busy)return;busy=true;key=k;card=null;scanInfo=null;wallet=null;wmode=null;
  try{
    if(me){
      var a=armed&&Date.now()-armed.at<120000?armed:null;if(armed)clearArm();
      var isV=me.role==='vendor'||me.role==='admin',isO=me.role==='organizer'||me.role==='admin',r=null;
      if(a&&a.type==='charge'&&isV)r=await rpc('charge',{k:k,p:a.amt,note:a.note});
      else if(a&&a.type==='topup'&&isO)r=await rpc('topup',{k:k,p:a.amt,method:a.note});
      if(r){last=r;say(r.text,r.ok);if(navigator.vibrate)navigator.vibrate(r.ok?80:[60,60,60]);if(r.ok&&me.role==='vendor')await pollSales(true)}
      scanInfo=await rpc('scan',{k:k});buzz(scanInfo?60:[60,60,60]);
      if(!scanInfo)say('Unknown bracelet.',false);else if(!r)say('Scanned '+scanInfo.name+'.',true);
    }else{tappedKey=k;card=await rpc('card',{k:k});if(!card)say('Unknown or deactivated bracelet.',false);
      else{var gs=ld('fb-guest');if(gs&&gs.k===k){wpin=gs.pin;wallet=await rpc('wallet',{k:k,pin_:gs.pin});if(wallet)wmode='open'}}}
  }catch(e){say(e.message,false)}
  busy=false;render();
  var g2=ld('fb-guest');if(!me&&card&&g2&&g2.k!==k&&feat('chat'))offerFriend(k);
}
function arm(type){var p=parseInt($('amt').value,10);if(!(p>0)){say('Enter a whole amount above 0.',false);return render()}
  armed={type:type,amt:p,note:type==='charge'?($('item').value.trim()):$('meth').value,at:Date.now()};sv('fb-armed',armed);last=null;scanInfo=null;listen();render()}
function disarm(){clearArm();render()}

/* ---- real NFC (Chrome on Android, https only) ---- */
async function listen(){
  if(!HAS){say('Web NFC needs Chrome on Android, opened over https.',false);return render()}
  if(nfcOn)return;
  try{var r=new NDEFReader();scanCtl=new AbortController();await r.scan({signal:scanCtl.signal});nfcOn=true;
    r.onreading=function(e){var t='';e.message.records.forEach(function(x){if(x.recordType==='url'||x.recordType==='text')t+=new TextDecoder(x.encoding||'utf-8').decode(x.data)+' '});
      var k=tokenFrom(t),sn=k?null:serialFrom(t);if(pairing){pair(e.serialNumber)}else if(sn)onSerial(sn);else onKey(k||e.serialNumber)};
    r.onreadingerror=function(){say('Could not read that tag. Hold it steady and try again.',false);render()};
    render();
  }catch(e){nfcOn=false;scanCtl=null;say('NFC could not start: '+e.message+'. Turn NFC on and allow the permission.',false);render()}
}
async function pair(serial){var id=pairing;pairing=null;try{await rpc('set_uid',{id:id,u:serial});say('Tag '+serial+' paired.',true);await loadAdm()}catch(e){say(e.message,false);render()}}
function pairTag(id){pairing=id;say('Hold the bracelet to the back of the phone to pair it.',true);listen();render()}
async function writeTag(token){
  if(!HAS){say('Writing tags needs Chrome on Android over https.',false);return render()}
  if(writeCtl)writeCtl.abort();
  if(scanCtl){scanCtl.abort();scanCtl=null;nfcOn=false}
  var ctl=writeCtl=new AbortController();
  try{say('Hold a blank tag to the back of the phone…',true);render();
    await new NDEFReader().write({records:[{recordType:'url',data:base()+'#b='+token}]},{overwrite:true,signal:ctl.signal});
    say('Tag written. Tap Start NFC, then scan it to test.',true)}
  catch(e){if(e.name==='AbortError'){if(writeCtl!==ctl)return;say('Write cancelled.',false)}else say('Write failed: '+e.message,false)}
  if(writeCtl===ctl)writeCtl=null;render()}
function copyLink(token){var u=base()+'#b='+token;if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){say('Link copied.',true);render()});else prompt('Copy:',u)}

/* ---- admin ---- */
async function loadAdm(){try{adm.guests=(await rpc('list_guests'))||[];if(me.role==='admin')adm.tx=(await rpc('ledger'))||[]}catch(e){say(e.message,false)}

function sNorm(s){s=String(s==null?'':s).toLowerCase();try{s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}catch(e){}return s}

  for(var k=1;k<r.length;k++){var l=m[m.length-1];if(r[k][0]<=l[1])l[1]=Math.max(l[1],r[k][1]);else m.push(r[k])}
  var o='',p=0;m.forEach(function(x){o+=esc(s.slice(p,x[0]))+'<mark>'+esc(s.slice(x[0],x[1]))+'</mark>';p=x[1]});return o+esc(s.slice(p))}

/* read what is already on the tag; null = empty (or unreadable), otherwise what it holds */
function swPeek(sig){return new Promise(function(ok){var r=new NDEFReader(),sc=new AbortController(),done=false;
  function fin(v){if(done)return;done=true;try{sc.abort()}catch(e){}ok(v)}
  sig.addEventListener('abort',function(){fin(null)});
  r.scan({signal:sc.signal}).then(function(){
    r.onreading=function(e){var recs=(e.message&&e.message.records)||[],t='';
      recs.forEach(function(x){if(x.recordType==='url'||x.recordType==='text'){try{t+=new TextDecoder(x.encoding||'utf-8').decode(x.data)+' '}catch(z){}}});
      fin(recs.length?{text:t.trim(),serial:serialFrom(t),token:tokenFrom(t)}:null)};
    r.onreadingerror=function(){fin(null)}}).catch(function(){fin(null)})})}
async function swKnow(pk){try{if(pk.serial){var b=await rpc('serial_info',{s:pk.serial});return !!(b&&b.state==='claimed')}
  if(pk.token){var c=await rpc('blank_info',{k:pk.token});return !!(c&&c.claimed)}}catch(e){}return null}
async function swUnlock(){var pw=($('sw_pw')||{}).value||'';
  if(!me||me.role!=='admin'){say('Only an admin can overwrite a bracelet.',false);return render()}
  if(!pw){say('Enter your admin password.',false);return render()}
  try{var ss=(await sb.auth.getSession()).data.session,em=ss&&ss.user&&ss.user.email;if(!em)throw new Error('Log in again, then retry.');
    var r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw new Error('Wrong password.');

  catch(e){say(e.message,false)}render()}
async function swWrite(force){if(!sw)return;if(!HAS){say('Writing tags needs Chrome on Android over https.',false);return render()}

  if(writeCtl)writeCtl.abort();if(scanCtl){scanCtl.abort();scanCtl=null;nfcOn=false}
  var ctl=writeCtl=new AbortController(),sr=sw.serial;
  try{say('Hold a bracelet to the back of the phone\u2026',true);render();
    if(!force){var pk=await swPeek(ctl.signal);
      if(pk){if(writeCtl===ctl)writeCtl=null;pk.claimed=await swKnow(pk);if(!sw)return;sw.blocked=pk;sw.ow=false;sw.unlocked=false;say('This bracelet is not empty. Nothing was written.',false);return render()}}
    await new NDEFReader().write({records:[{recordType:'url',data:base()+'?s='+sr}]},{overwrite:true,signal:ctl.signal});
    if(sw){sw.ok=true;sw.list.push(sr);sw.blocked=null;sw.ow=false;sw.unlocked=false}say('Written.',true);
    rpc('serial_register',{s:sr}).catch(function(){})}
  catch(e){if(e.name==='AbortError'){if(writeCtl!==ctl)return;say('Write cancelled.',false)}else say('Write failed: '+e.message,false)}
  if(writeCtl===ctl)writeCtl=null;render()}

  if(bank){var bc=$(p+'b').value,nm=$(p+'h').value.trim();
    if(!bc)return {err:'Choose your bank.'};if(dg.length<8)return {err:'Enter a valid account number.'};if(nm.length<2)return {err:'Enter the account name.'};
    return {type:'bank',number:dg,network:null,bank:bc,name:nm}}
  if(dg.length<9)return {err:'Enter a valid MoMo number.'};
  if(dg.indexOf('233')===0&&dg.length===12)dg='0'+dg.slice(3);
  return {type:'momo',number:dg,network:$(p+'n').value,bank:null,name:null}}

function vMoneyFlow(){var m=mwMode,bal='<p class="mut">Money wallet balance: <b>'+esc(mny(mw&&mw.balance))+'</b>. Fee: '+esc(feeTxt('money'))+'.</p>',

  if(m==='deposit')return '<div class="card xmny">'+mwHead('Add money')+'<p class="mut">You pay on a secure Paystack page (MoMo or card). Money reaches your wallet only after Paystack confirms the payment. The fee is taken from what you pay.</p><div class="row">'+[10,20,50,100].map(function(x){return '<button onclick="$(\'mwa\').value='+x+';mwPrev()">'+x+'</button>'}).join('')+'</div><div class="row" style="margin-top:10px"><input id="mwa" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Amount (GH\u20B5)" oninput="mwPrev()"></div>'+er+'<button class="go" id="mwgo" style="width:100%" onclick="mwDeposit()">Continue to Paystack</button></div>';
  if(m==='send')return '<div class="card xmny">'+mwHead('Send money')+'<p class="mut">Real money, not event tokens. Sends cannot be undone and can never be more than your wallet holds.</p>'+bal+
    (mwPeople.length?'<select id="mws" style="width:100%"><option value="">Choose a guest</option>'+mwPeople.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join('')+'</select>':'<p class="mut">'+(mwErr?esc(mwErr):'No other guests available yet.')+'</p>')+
    '<div class="row" style="margin-top:10px"><input id="mwa" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="Amount (GH\u20B5)" oninput="mwPrev()"><input id="mwpin" type="password" inputmode="numeric" placeholder="Your PIN" autocomplete="off"></div>'+er+'<button class="go" id="mwgo" style="width:100%" onclick="mwSend()">Send money</button></div>';
  return '<div class="card xmny">'+mwHead('Withdraw money')+'<p class="mut">Paystack sends it to your account, usually within minutes. The amount and fee leave your wallet now; if the transfer fails, everything is returned automatically. Minimum GH\u20B5 5.00. Paystack pays to MoMo or bank accounts, not debit cards.</p>'+bal+
    '<div class="xf">'+acctFields('w')+'<input id="mwa" type="number" inputmode="decimal" min="5" step="0.01" placeholder="Amount (GH\u20B5)" oninput="mwPrev()" style="width:100%"><input id="mwpin" type="password" inputmode="numeric" placeholder="Your PIN" autocomplete="off" style="width:100%"></div>'+er+'<button class="go" id="mwgo" style="width:100%" onclick="mwWithdraw()">Withdraw to my account</button></div>'}
/* the button switches off when the amount is more than the wallet holds */
var mwPrev0=mwPrev;
mwPrev=function(){mwPrev0();var g=$('mwgo'),a=$('mwa');if(!g||!a||!mw)return;var v=pes(a.value),f=feeOf('money',v)||0,over=false;
  if(mwMode==='convert'){var r=Number(mw.pts_rate)||0,pt=Math.floor(v/100*r),c=r>0?Math.min(v,Math.ceil(pt*100/r)):0;over=c>mw.balance}
  else if(mwMode==='send'||mwMode==='withdraw')over=v+f>mw.balance;
  g.disabled=!!over}
async function mwWithdraw(){if(mwBusy)return;var a=pes($('mwa').value),p=$('mwpin').value.trim(),er=$('mwe'),ac=acctRead('w');
  if(!(a>=500)||!p){er.textContent='Enter at least GH\u20B5 5.00 and your PIN.';return}
  if(ac.err){er.textContent=ac.err;return}
  var f=feeOf('money',a);if(f==null){er.textContent='Fees are not loaded yet. Go back and try again.';return}

  mwBusy=true;ownAt=Date.now();
  try{var r=await rpc('money_withdraw',{k:key,pin_:p,amt:a,momo:ac.number,network:ac.network,expect_fee:f,p_type:ac.type,p_bank:ac.bank,p_name:ac.name});
    mwMode=null;mw=null;render();mwPop('Withdrawal on its way',mny(r.amount),'to '+ac.number,'Fee '+mny(r.fee)+'. Paystack is sending it now.');
    payoutCall({action:'send',kind:'guest',id:r.id}).then(function(){setTimeout(function(){payoutCall({action:'check',kind:'guest',id:r.id}).catch(function(){})},9000)}).catch(function(){})}
  catch(e){er.textContent=e.message}
  mwBusy=false}
async function mwConvert(){if(mwBusy)return;var a=pes($('mwa').value),p=$('mwpin').value.trim(),er=$('mwe');
  if(!(a>=100)){er.textContent='Enter at least GH\u20B5 1.00.';return}
  if(!/^[0-9]{4,6}$/.test(p)){er.textContent='Enter your PIN.';return}
  mwBusy=true;$('mwgo').disabled=true;er.textContent='Converting\u2026';
  try{var r=await rpc('money_to_points',{k:key,pin_:p,amt:a});mwMode=null;mw=null;tsp=null;try{wallet=await rpc('wallet',{k:key,pin_:wpin})}catch(e){}render();mwPop('You got',r.points+' paid tokens','for '+mny(r.spent),'Money balance now '+mny(r.balance))}
  catch(e){er.textContent=e.message;var b=$('mwgo');if(b)b.disabled=false}
  mwBusy=false}

/* ---- guest: EVENT TOKENS (yellow) with the admin-loaded / paid split ---- */
async function tsLoad(){try{tsp=await rpc('token_split',{k:key,pin_:wpin})||false}catch(e){tsp=false}if(uiIdle()&&!chatOpen&&!giftOpen&&!mwMode)render()}
function tokSplit(w){if(tsp===null){setTimeout(tsLoad,0);return ''}if(!tsp)return '';var a=tsp.admin,p=tsp.paid,can=tsp.can_cashout&&p>0;
  return '<div class="xk" style="margin:10px 0"><div><span class="mut">Admin-loaded<br>(spent first)</span><b>'+a+'</b></div><div><span class="mut">Paid with your money<br>(spent second)</span><b>'+p+'</b></div></div>'+
  '<p class="mut">Spend them at stalls or send them to friends. Tokens cannot be withdrawn directly. '+(can?'Your event has ended, so your paid tokens can go back into your money wallet.':'After your event ends, unused paid tokens can be turned back into money.')+'</p>'+

gPrev=function(){gPrev0();var p=$('gprev');if(!p||!wallet)return;var a=parseInt($('gam').value,10),f=feeOf('token',a)||0;if(a>0&&a+f>wallet.balance)p.innerHTML+='<br><b>You only have '+wallet.balance+' tokens.</b>'}
setInterval(async function(){if(me||!wallet||!key||wmode!=='open'||document.hidden||mwMode)return;
  try{var d=await rpc('token_split',{k:key,pin_:wpin});if(d&&JSON.stringify(d)!==JSON.stringify(tsp)){tsp=d;if(uiIdle()&&!chatOpen&&!giftOpen)render()}}catch(e){}},12000);

/* ---- vendor: sales by source, close my section, request payout ---- */
async function vdLoad(){try{var d=await rpc('my_vendor');if(JSON.stringify(d)!==JSON.stringify(vdat)){vdat=d;if(uiIdle())render()}}
  catch(e){if(!vdat){vdat=false;render()}}}
function vVendor(){if(vdat&&vdat.sid&&me&&vdat.sid!==me.id)vdat=undefined;
  if(vdat===undefined){vdat=null;setTimeout(vdLoad,0)}
  return '<div id="vsum"></div>'+vTill()+vdCard()+'<div id="vrec"></div>'}
var vTill0=vTill;
vTill=function(){if(me&&me.role==='vendor'&&vdat&&vdat.closed)return lastCard()+'<div class="card"><h2>Section closed</h2><p class="mut">You cannot charge guests any more. Request your payout below.</p></div>';return vTill0()};
function vdCard(){var d=vdat;
  if(d===null||d===undefined)return '<div class="card"><p class="mut">Loading payout details\u2026</p></div>';
  if(d===false)return '<div class="card"><h2>Payouts</h2><p class="mut">Not available yet. Ask an admin to run xend-tokens-v2.sql.</p></div>';
  var r=d.rate,pt=d.paid_avail,at=d.admin_avail,
    h='<div class="card"><h2>Your earnings to be paid out</h2><div class="xk"><div><span class="mut">Paid tokens<br>(real money)</span><b>'+pt+' pts</b><span class="mut">'+tokVal(pt,r)+' \u00B7 paid automatically</span></div>'+
    '<div><span class="mut">Admin-loaded tokens<br>(event tokens)</span><b>'+at+' pts</b><span class="mut">'+tokVal(at,r)+' \u00B7 needs admin approval</span></div></div>';
  if(!d.closed)h+=d.event_closed?'<p class="mut">The event is closed. Close your section when you have finished selling. After that you cannot charge any more guests.</p><button class="go" style="width:100%" onclick="vdClose()">Close my section</button>':'<p class="mut">You can close your section after an admin closes the event'+(d.event_name?' ('+esc(d.event_name)+')':'')+'. Then you can request your payout.</p>';
  else if(pt+at>0)h+='<p class="mut">Your section is closed. Enter where to send the money. Paid tokens are sent straight away. Admin-loaded tokens are sent after an admin approves them. It can take between 1 and 24 hours to reflect.</p><div class="xf">'+acctFields('vp')+'</div><div id="vde" class="mut" role="status" style="min-height:1.4em;margin:8px 0"></div><button class="go" style="width:100%" onclick="vdRequest()">Request payout \u00B7 '+tokVal(pt+at,r)+'</button>';
  else h+='<p class="mut">Your section is closed and there is nothing left to pay out.</p>';

  return h}
async function vdClose(){if(vBusy)return;if(!confirm('Close your section? You will not be able to charge any more guests. Only an admin can reopen it.'))return;
  vBusy=true;try{await rpc('vendor_close');toast('Your section is closed.',true);vdat=undefined}catch(e){toast(e.message,false)}vBusy=false;render()}
async function vdRequest(){if(vBusy)return;var ac=acctRead('vp'),er=$('vde');if(ac.err){er.textContent=ac.err;return}

  try{var r=await rpc('vendor_request_payout',{p_type:ac.type,p_number:ac.number,p_network:ac.network,p_bank:ac.bank,p_name:ac.name});

    toast(r.waiting?'Requested. Admin-loaded earnings wait for approval.':'Requested. Paystack is sending it now.',true);vdat=undefined}
  catch(e){er.textContent=e.message}

/* ---- admin: Tokens tab (sources, vendor payouts, leftovers by event) ---- */
async function tokLoad(){try{tkd=await rpc('tokens_admin');tkErr='';payoutCall({action:'sweep'}).catch(function(){})}catch(e){tkd=null;tkErr=e.message}if(uiIdle())render()}
function vTokAdmin(){var d=tkd;
  if(d===undefined)return '<div class="card"><p class="mut">Loading\u2026</p></div>';
  if(d===null)return '<div class="card"><p class="mut">Could not load'+(tkErr?': '+esc(tkErr):'')+'. Run xend-tokens-v2.sql in Supabase first.</p></div>';
  var r=d.rate,P=d.payouts||[],V=d.vendors||[],E=d.events||[],btn='min-height:38px';

    '<div class="xk"><div><span class="mut">Admin-loaded<br>(cash taken at the desk)</span><b>'+d.guest_admin+'</b><span class="mut">'+tokVal(d.guest_admin,r)+' in guest wallets</span></div><div><span class="mut">Paid<br>(converted from Paystack money)</span><b>'+d.guest_paid+'</b><span class="mut">'+tokVal(d.guest_paid,r)+' in guest wallets</span></div></div></div>';

  h+='<div class="card"><h2>Vendor payouts waiting for approval ('+wait.length+')</h2><p class="mut">These come from admin-loaded tokens, so the cash is with you, not in Paystack. Approve to send it through Paystack. Make sure your Paystack balance can cover it.</p>'+
    (wait.length?wait.map(function(x){return '<div class="item"><div class="row sp"><span>'+who(x)+'</span><b>'+esc(mny(x.amount))+'</b></div><div class="mut">'+x.points+' admin-loaded tokens</div><div class="row" style="margin-top:6px"><button class="go" style="'+btn+'" onclick="tokApprove(\''+esc(x.id)+'\')">Approve &amp; send</button><button class="bad" style="'+btn+'" onclick="tokReject(\''+esc(x.id)+'\')">Reject</button></div></div>'}).join(''):'<p class="mut">Nothing waiting.</p>')+
    (rest.length?'<details style="margin-top:10px"><summary><b>Other payouts</b></summary>'+rest.map(function(x){return '<div class="item row sp"><span>'+who(x)+'<br><span class="mut">'+(x.bucket==='paid'?'paid tokens (automatic)':'admin-loaded (approved)')+(x.note?' \u00B7 '+esc(x.note):'')+'</span></span><span><b>'+esc(mny(x.amount))+'</b><br><span class="tag">'+esc(PST[x.status]||x.status)+'</span>'+(x.status==='queued'?'<br><button style="'+btn+';margin-top:6px" onclick="tokSend(\'vendor\',\''+esc(x.id)+'\')">Send now</button>':'')+'</span></div>'}).join('')+'</details>':'')+'</div>';
  h+='<div class="card"><h2>Vendors</h2>'+(V.length?'<div style="overflow-x:auto"><table><tr><td><b>Vendor</b></td><td class="xr"><b>Paid tokens</b></td><td class="xr"><b>Admin-loaded</b></td><td></td></tr>'+V.map(function(v){var b=v.bal;

        (e.closed?'<div class="row" style="margin-top:6px"><button class="go" style="'+btn+'" onclick="tokLeft(\''+esc(e.id)+'\',\'redeemed\')">Redeem to guests</button><button style="'+btn+'" onclick="tokLeft(\''+esc(e.id)+'\',\'kept\')">Keep in company</button></div>':'<p class="mut" style="margin:6px 0 0">Close the event in the Events tab first.</p>'))+'</div>'}).join(''):'<p class="mut">No events yet.</p>')+'</div>';
  return h}
async function tokApprove(id){if(tkBusy)return;tkBusy=true;
