<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>XEND-CASH</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--mut:#5c5c5c;--line:#e4e4e4;--fld:#9a9a9a;--edge:#111;--acc:#ffc400;--bad:#111;--onbg:#111;--onfg:#ffc400;--errbg:#111;--errfg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--card:#171717;--ink:#fff;--mut:#b8b8b8;--line:#2e2e2e;--fld:#585858;--edge:#ffc400;--bad:#fff;--onbg:#ffc400;--onfg:#111;--errbg:#fff;--errfg:#111;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;border-bottom:4px solid var(--acc);padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.hin{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header b{color:var(--acc);font-size:1.2rem;letter-spacing:.5px}
header .mut{color:#c9c9c9}
#who{display:flex;align-items:center;gap:8px}
header button{min-height:38px;padding:6px 12px;background:transparent;color:#fff;border-color:#777}
main{max-width:640px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
h2{font-size:1.1rem;margin:0 0 10px}
.ph{width:84px;height:84px;border-radius:50%;overflow:hidden;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--card);flex:none}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card{background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:16px;margin-bottom:14px}
.card:has(.bal){background:var(--acc);color:#111;border-color:#111}
.card:has(.bal) .mut{color:#2b2b2b}
.bal{font-size:2.8rem;font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer;font-weight:600;touch-action:manipulation}
button:active{transform:scale(.98)}
button.go{background:var(--acc);border-color:#111;color:#111;font-weight:700}
button.on{background:var(--onbg);color:var(--onfg);border-color:var(--onbg)}
button.bad{color:var(--bad);border-style:dashed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input,select{background:var(--card);border:2px solid var(--fld);border-radius:12px;padding:10px 12px;min-height:46px;min-width:0;max-width:100%}
.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.msg{border:2px solid var(--edge);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.ok{background:var(--acc);color:#111}.err{background:var(--errbg);color:var(--errfg)}
.tag{border:2px solid var(--edge);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}.tag.ok{border-color:#111}
.big{font-size:1.25rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.lnk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-height:56px}
a.lnk:active{opacity:.6}
.ic{flex:0 0 42px;height:42px;border-radius:50%;background:#111;color:#ffc400;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.lk{padding:12px 0;border-top:1px solid var(--line)}.lk:first-child{border-top:0}
.lk input[type=text]{width:100%;margin-top:8px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tg span{display:flex;align-items:center;gap:8px;font-weight:600}
input[type=checkbox]{width:26px;height:26px;min-height:0;padding:0;accent-color:#ffc400}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;padding:10px 4px}
.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto!important;padding:10px 14px}
#pop:empty{display:none}
#pop{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.7)}
.popcard{background:var(--acc);color:#111;border:3px solid #111;border-radius:20px;padding:22px;width:100%;max-width:380px;text-align:center;max-height:90vh;overflow:auto}
.popcard .bal{font-size:3.4rem;margin:6px 0}
@media(max-width:560px){
 .row input,.row select{width:100%!important;flex:1 1 100%!important}
 .row:not(.sp) button{flex:1 1 auto}
 .card{padding:14px}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;max-width:92%;padding:12px 16px;border:2px solid #111;border-radius:14px;font-weight:700;background:var(--acc);color:#111;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#toast.err{background:#111;color:#fff;border-color:#ffc400}#toast:empty{display:none}
.pulse{width:96px;height:96px;margin:12px auto;border-radius:50%;background:#111;color:#ffc400;display:flex;align-items:center;justify-content:center;font-size:2.4rem;animation:pls 1.2s ease-out infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(17,17,17,.55)}100%{box-shadow:0 0 0 38px rgba(17,17,17,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.av{flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;border:2px solid var(--edge)}
button.frow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;text-align:left;font-weight:400}
.dot{background:#d00;color:#fff;border-radius:99px;min-width:22px;height:22px;padding:0 6px;font-size:.8rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
#snapcam,#snapv{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#snapv{z-index:50;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sv-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.sv-top button,#snapcam .sv-top button{background:transparent;color:#fff;border-color:#777}
.sv-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.sv-stage video,.sv-stage canvas{max-width:100%;max-height:100%;pointer-events:none}
.sv-wm{position:absolute;inset:0;overflow:hidden;pointer-events:none;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;gap:28px;transform:rotate(-24deg) scale(1.4);font-weight:800;font-size:.9rem;color:rgba(255,255,255,.22)}
@media print{#snapv,#snapcam{display:none!important}}
textarea{font:inherit;color:inherit;background:var(--card);border:2px solid var(--fld);border-radius:12px;padding:10px 12px;width:100%;min-height:90px;max-width:100%;resize:vertical}
textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.xban{background:var(--acc);color:#111;border:2px solid #111;border-radius:12px;padding:10px 14px;font-weight:700;text-align:center;margin-bottom:14px}
.xhero{text-align:center;padding:26px 8px 18px}
.xhero h1{font-size:2rem;line-height:1.15;margin:8px 0}
.xherologo{display:block;margin:0 auto 6px;max-width:80%;object-fit:contain}
.xbimg{display:block;width:100%;aspect-ratio:16/6;object-fit:cover;border:2px solid var(--edge);border-radius:16px;margin-bottom:14px}
.xbimg.whole{aspect-ratio:auto;height:auto;object-fit:contain}
.xlogo{height:32px;max-width:120px;object-fit:contain;vertical-align:middle;margin-right:8px;border-radius:6px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.xgrid .card{margin:0}
.xp img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid var(--edge);margin-bottom:10px;display:block}
.xf{display:flex;flex-direction:column;gap:10px}
.xf label{font-weight:700;font-size:.9rem}
.anim-fade-in{animation:xfi .7s ease both}
.anim-slide-up{animation:xsu .7s ease both}
.anim-pulse{animation:xpl 2.4s ease-in-out infinite}
@keyframes xfi{from{opacity:0}to{opacity:1}}
@keyframes xsu{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes xpl{50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.anim-fade-in,.anim-slide-up,.anim-pulse{animation:none}}
#ordm{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#ordm .card{width:100%;max-width:420px;max-height:92vh;overflow:auto;margin:0}
#ordm input,#ordm select{width:100%}

.card.xmny{background:#0f2e22;color:#fff;border-color:#0f2e22}
.card.xmny .mut{color:#b9d8c9}
.card.xmny .bal{color:#7dffb0}
.card.xmny button{background:transparent;color:#fff;border-color:#7dffb0}
.card.xmny button.go{background:#7dffb0;color:#0f2e22;border-color:#7dffb0}
.card.xmny input,.card.xmny select{background:#fff;color:#111;border-color:#7dffb0}
.card.xmny .item{border-color:#24503f}
.tag.xm{border-color:#7dffb0;color:#7dffb0}
.xk{display:grid;grid-template-columns:1fr 1fr;gap:10px}.xk>div{border:2px solid var(--edge);border-radius:12px;padding:10px 12px}
.xk b{font-size:1.25rem;display:block}
td.xr,th.xr{text-align:right;white-space:nowrap}
</style>
</head>
<body>
<header><div class="hin"><b>XEND-CASH</b><span class="mut" id="nfc"></span><button id="bell" onclick="bellTap()" aria-label="Alerts"></button><span id="who"></span></div></header>
<main>
<div id="msg"></div><div id="view"></div>
</main>
<div id="pop"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* PUT YOUR SUPABASE DETAILS HERE (between the quotes). Leave empty to use the setup screen instead. */
var MAILDOM='xendcash.app',cdirty=false,editG=null,lmode=ld('fb-lmode')||'guest',vs=null,vtimer=null,lastSale=null,popItems=[];
var DEFAULT_CFG={url:'https://lczfcbjnafaknxlkqlbs.supabase.co',key:'sb_publishable_pyjdDTRequIqNNw8L_om0w_mYkvcOL1'};
var cfg=(DEFAULT_CFG.url&&DEFAULT_CFG.key)?DEFAULT_CFG:ld('fb-cfg'),armed=ld('fb-armed'),sb=null,me=null,key=null,card=null,scanInfo=null,wallet=null,wmode=null,wpin='',tab='till',last=null,flash=null,nfcOn=false,pairing=null,busy=false,adm={guests:[],tx:[],vendors:[],staff:[],events:[],buys:[]},evSel='',closeSum=null;
var HAS=('NDEFReader' in window),scanCtl=null,writeCtl=null;
function say(t,ok){flash={t:t,ok:ok}}
async function rpc(n,a){if(/^(chat_send|gift_send|chat_snap_open|chat_snap_put|chat_snap_redeem)$/.test(n))ownAt=Date.now();var r=await sb.rpc(n,a||{});if(r.error)throw new Error(r.error.message);return r.data}
function tokenFrom(s){var m=String(s||'').match(/[#?&\/]b[=\/]([0-9a-f]{32})/i)||String(s||'').match(/\b([0-9a-f]{32})\b/i);return m?m[1].toLowerCase():null}
function base(){return location.href.split('#')[0].split('?')[0]}
function clearArm(){armed=null;sv('fb-armed',null)}

async function boot(){
  payCapture();
  if(cfg){sb=supabase.createClient(cfg.url,cfg.key);try{FX=await rpc('cfg_get')||FX}catch(e){}var s=(await sb.auth.getSession()).data.session;if(s)await loadMe();
    var fm=String(location.hash||'').match(/[#&]f=([0-9a-f]{6})/i);if(fm){try{history.replaceState(null,'',location.pathname)}catch(e){}await friendLink(fm[1].toUpperCase());return}
    var t=tokenFrom(location.hash||location.search);if(t){try{history.replaceState(null,'',location.pathname)}catch(e){}await onKey(t);return}
    if(!me){var gs=ld('fb-guest');if(gs){try{key=gs.k;wpin=gs.pin;wallet=await rpc('wallet',{k:gs.k,pin_:gs.pin});if(wallet)wmode='open';else{key=null;sv('fb-guest',null)}}catch(e){key=null}}}}
  render();
}
async function loadMe(){try{me=await rpc('me')}catch(e){me=null}try{caps=me&&me.role==='organizer'?await rpc('my_caps'):null}catch(e){caps=null}if(me&&me.role!=='vendor')tab='top';if(me&&me.role==='vendor')startSales()}
function loginEmail(){var e=$('em').value.trim();return e.indexOf('@')<0?e.toLowerCase()+'@'+MAILDOM:e}
async function login(kind){try{var r=await sb.auth.signInWithPassword({email:loginEmail(),password:$('pw').value});if(r.error)throw r.error;await loadMe();
    if(!me)await wrongDoor('This account has no role yet. Ask an admin.');
    else if(kind==='vendor'&&me.role!=='vendor')await wrongDoor('This is an admin or staff account. Use Admin / Staff login.');
    else if(kind==='staff'&&me.role==='vendor')await wrongDoor('This is a vendor account. Use Vendor login.');
    else say('Welcome, '+me.name+'.',true)}
  catch(e){say(/invalid/i.test(e.message)?'Wrong username or password.':e.message,false)}render()}
async function wrongDoor(t){stopSales();await sb.auth.signOut();me=null;vs=null;lastSale=null;say(t,false)}
function setL(m){lmode=m;sv('fb-lmode',m);render()}
function roleLabel(r){return r==='vendor'?'Vendor':r==='organizer'?'Staff':'Admin'}
async function logout(){stopSales();vs=null;lastSale=null;closePop();await sb.auth.signOut();me=null;clearArm();last=null;scanInfo=null;say('Logged out.',true);render()}

/* ---- a bracelet was tapped (real NFC or opened link) ---- */
async function onKey(k){
  if(busy)return;busy=true;key=k;card=null;scanInfo=null;wallet=null;wmode=null;
  try{
    if(me){
      var a=armed&&Date.now()-armed.at<120000?armed:null;if(armed)clearArm();
      var isV=me.role==='vendor'||me.role==='admin',isO=me.role==='organizer'||me.role==='admin',r=null;
      if(a&&a.type==='charge'&&isV)r=await rpc('charge',{k:k,p:a.amt,note:a.note});
      else if(a&&a.type==='topup'&&isO)r=await rpc('topup',{k:k,p:a.amt,method:a.note});
      if(r){last=r;say(r.text,r.ok);if(navigator.vibrate)navigator.vibrate(r.ok?80:[60,60,60]);if(r.ok&&me.role==='vendor')await pollSales(true)}
      scanInfo=await rpc('scan',{k:k});buzz(scanInfo?60:[60,60,60]);
      if(!scanInfo)say('Unknown bracelet.',false);else if(!r)say('Scanned '+scanInfo.name+'.',true);
    }else{tappedKey=k;card=await rpc('card',{k:k});if(!card)say('Unknown or deactivated bracelet.',false);
      else{var gs=ld('fb-guest');if(gs&&gs.k===k){wpin=gs.pin;wallet=await rpc('wallet',{k:k,pin_:gs.pin});if(wallet)wmode='open'}}}
  }catch(e){say(e.message,false)}
  busy=false;render();
  var g2=ld('fb-guest');if(!me&&card&&g2&&g2.k!==k&&feat('chat'))offerFriend(k);
}
function arm(type){var p=parseInt($('amt').value,10);if(!(p>0)){say('Enter a whole amount above 0.',false);return render()}
  armed={type:type,amt:p,note:type==='charge'?($('item').value.trim()):$('meth').value,at:Date.now()};sv('fb-armed',armed);last=null;scanInfo=null;listen();render()}
function disarm(){clearArm();render()}

/* ---- real NFC (Chrome on Android, https only) ---- */
async function listen(){
  if(!HAS){say('Web NFC needs Chrome on Android, opened over https.',false);return render()}
  if(nfcOn)return;
  try{var r=new NDEFReader();scanCtl=new AbortController();await r.scan({signal:scanCtl.signal});nfcOn=true;
    r.onreading=function(e){var t='';e.message.records.forEach(function(x){if(x.recordType==='url'||x.recordType==='text')t+=new TextDecoder(x.encoding||'utf-8').decode(x.data)+' '});
      var k=tokenFrom(t)||e.serialNumber;if(pairing){pair(e.serialNumber)}else onKey(k)};
    r.onreadingerror=function(){say('Could not read that tag. Hold it steady and try again.',false);render()};
    render();
  }catch(e){nfcOn=false;scanCtl=null;say('NFC could not start: '+e.message+'. Turn NFC on and allow the permission.',false);render()}
}
async function pair(serial){var id=pairing;pairing=null;try{await rpc('set_uid',{id:id,u:serial});say('Tag '+serial+' paired.',true);await loadAdm()}catch(e){say(e.message,false);render()}}
function pairTag(id){pairing=id;say('Hold the bracelet to the back of the phone to pair it.',true);listen();render()}
async function writeTag(token){
  if(!HAS){say('Writing tags needs Chrome on Android over https.',false);return render()}
  if(writeCtl)writeCtl.abort();
  if(scanCtl){scanCtl.abort();scanCtl=null;nfcOn=false}
  var ctl=writeCtl=new AbortController();
  try{say('Hold a blank tag to the back of the phone…',true);render();
    await new NDEFReader().write({records:[{recordType:'url',data:base()+'#b='+token}]},{overwrite:true,signal:ctl.signal});
    say('Tag written. Tap Start NFC, then scan it to test.',true)}
  catch(e){if(e.name==='AbortError'){if(writeCtl!==ctl)return;say('Write cancelled.',false)}else say('Write failed: '+e.message,false)}
  if(writeCtl===ctl)writeCtl=null;render()}
function copyLink(token){var u=base()+'#b='+token;if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){say('Link copied.',true);render()});else prompt('Copy:',u)}

/* ---- admin ---- */
async function loadAdm(){try{adm.guests=(await rpc('list_guests'))||[];if(me.role==='admin')adm.tx=(await rpc('ledger'))||[]}catch(e){say(e.message,false)}
  try{adm.events=(await rpc('list_events'))||[]}catch(e){adm.events=null}
  if(me.role==='admin')try{adm.vendors=(await rpc('vendor_report',{eid:evSel||null}))||[]}catch(e){adm.vendors=null}
  try{adm.buys=(await rpc('purchases',{eid:evSel||null}))||[]}catch(e){adm.buys=null}
  try{adm.staff=(await rpc('list_staff'))||[]}catch(e){adm.staff=null}render()}
function setTab(t){tab=t;if(t!=='top')loadAdm();else render()}
async function createGuest(){var n=$('gn').value.trim();if(!n){say('Enter a guest name.',false);return render()}
  var a=$('ga').value.split(',').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return {name:x,done:false}});
  try{var r=await rpc('create_guest',{n:n,r:$('gr').value.trim(),a:a,p_event:$('ge').value||null});say('Card created for '+n+'. Guest PIN '+r.pin+'.',true);await loadAdm();if(HAS)writeTag(r.token)}catch(e){say(e.message,false);render()}}
async function markDone(i){try{await rpc('mark_done',{k:key,i:i});scanInfo=await rpc('scan',{k:key});say('Marked done.',true)}catch(e){say(e.message,false)}render()}

/* ---- guest wallet ---- */
async function openWallet(){wpin=$('pin').value;try{wallet=await rpc('wallet',{k:key,pin_:wpin});if(!wallet)say('Wrong PIN.',false);else{wmode='open';sv('fb-guest',{k:key,pin:wpin})}}catch(e){say(e.message,false)}render()}
async function guestLogin(){var n=$('gname').value.trim(),p=$('gpin').value.trim();if(!n||!p){say('Enter your name and PIN.',false);return render()}
  try{var r=await rpc('guest_login',{n:n,pin_:p});if(!r.ok){say(r.text,false);return render()}
    key=r.token;wpin=p;wallet=await rpc('wallet',{k:key,pin_:p});
    if(!wallet)say('Could not open your wallet.',false);else{wmode='open';sv('fb-guest',{k:key,pin:p});say('Welcome, '+wallet.name.split(' ')[0]+'.',true)}}
  catch(e){say(e.message,false)}render()}
async function refreshWallet(){cdirty=false;try{wallet=await rpc('wallet',{k:key,pin_:wpin});if(!wallet){say('Session expired. Log in again.',false);guestOut();return}say('Updated.',true)}catch(e){say(e.message,false)}render()}
async function changePin(){var o=$('op').value.trim(),n=$('np').value.trim();if(!o||!n){say('Enter your current and new PIN.',false);return render()}

  '@media (prefers-color-scheme:dark){:root{'+d('dark')+'--onbg:var(--acc);--onfg:var(--onacc)}}'+
  'header{background:var(--hdr)}.ic{background:var(--hdr);color:var(--acc)}button.go,.ok,.xban,.popcard,#toast,.card:has(.bal){color:var(--onacc)}'}
function themeApply(t){var c=themeCss(t);if(c===themeLast)return;themeLast=c;
  var s=$('xtheme');if(!s){s=document.createElement('style');s.id='xtheme';document.head.appendChild(s)}s.textContent=c;
  var dk=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches,mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',themeVal(t,dk?'dark':'light','hdr'))}

    for(var i=0;i<8;i++){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));var x=c.getContext('2d');
      if(logo){x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/webp',.9);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/png')}
      else{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q)}
      if(out.length<=lim)break;sc*=.8;q=Math.max(.5,q-.08)}
    URL.revokeObjectURL(u);brandSync();brandDraft[logo?'logo':'bn']=out;if(!logo&&brandDraft.bon===undefined)brandDraft.bon=1;render()};
  img.onerror=function(){URL.revokeObjectURL(u);toast('Could not read that image.',false)};img.src=u}
function brandClear(kind){brandSync();brandDraft[kind==='logo'?'logo':'bn']='';render()}
function xvBrand(){brandDraft=brandDraft||JSON.parse(JSON.stringify(FX.brand||{}));var d=brandDraft,lg=okData(d.logo)?d.logo:'',bn=okData(d.bn)?d.bn:'';
  var pv='background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 50%/16px 16px;border:2px solid var(--edge);border-radius:12px;padding:10px;text-align:center';
  return '<div class="card"><h2>Logo</h2><p class="mut">Upload a PNG, JPG or WebP. It is resized automatically so the site stays fast. Transparent PNGs keep their transparency.</p>'+
  '<div style="'+pv+'">'+(lg?'<img src="'+esc(lg)+'" alt="" style="max-height:90px;max-width:100%;object-fit:contain">':'<span class="mut" style="background:var(--card);padding:2px 8px;border-radius:8px">No logo uploaded'+(xurl(xv('site_logo_url'))?' (old logo link is used)':'')+'</span>')+'</div>'+
  (lg?'<p class="mut" style="margin:6px 0 0">'+kb(lg)+'</p>':'')+
  '<div class="row" style="margin-top:10px"><button class="go" onclick="$(\'bf_logo\').click()">Upload logo</button><button class="bad" onclick="brandClear(\'logo\')">Remove</button><input type="file" id="bf_logo" accept="image/*" hidden onchange="brandPick(\'logo\',this)"></div>'+
  '<div class="xf" style="margin-top:10px"><div><label for="bd_lp">Position</label>'+xSel('bd_lp',LPOS,d.lp||'header')+'</div><div><label for="bd_ls">Size</label>'+xSel('bd_ls',LSZ,d.ls||'m')+'</div></div></div>'+
  '<div class="card"><h2>Banner image</h2><p class="mut">A picture strip on the landing page, for example a product photo or an event poster.</p>'+
  '<div style="'+pv+';padding:0;overflow:hidden">'+(bn?'<img src="'+esc(bn)+'" alt="" style="width:100%;display:block;'+(d.bs==='whole'?'':'aspect-ratio:16/6;object-fit:cover')+'">':'<div class="mut" style="padding:22px"><span style="background:var(--card);padding:2px 8px;border-radius:8px">No banner uploaded</span></div>')+'</div>'+
  (bn?'<p class="mut" style="margin:6px 0 0">'+kb(bn)+'</p>':'')+
  '<div class="row" style="margin-top:10px"><button class="go" onclick="$(\'bf_bn\').click()">Upload banner</button><button class="bad" onclick="brandClear(\'bn\')">Remove</button><input type="file" id="bf_bn" accept="image/*" hidden onchange="brandPick(\'bn\',this)"></div>'+
  '<div class="xf" style="margin-top:10px"><label class="tg" style="justify-content:flex-start"><input type="checkbox" id="bd_on"'+(d.bon===0?'':' checked')+'><span>Show the banner</span></label>'+
  '<div><label for="bd_bp">Where</label>'+xSel('bd_bp',BNPOS,d.bp||'top')+'</div><div><label for="bd_bs">Shape</label>'+xSel('bd_bs',BNSHAPE,d.bs||'wide')+'</div>'+
  '<div><label for="bd_ba">Description (for screen readers)</label><input id="bd_ba" value="'+esc(d.ba||'')+'" maxlength="120" style="width:100%"></div>'+
  '<div><label for="bd_bl">Link when tapped (optional)</label><input id="bd_bl" value="'+esc(d.bl||'')+'" placeholder="https://... or tel:+233..." maxlength="300" autocapitalize="none" style="width:100%"></div></div></div>'+
  '<button class="go" style="width:100%" onclick="brandSave()">Save logo &amp; banner</button>'}
var ASSET_BUCKET='site-assets';
function assetDrop(old,keep){var p=assetPath(old);if(p&&old!==keep){try{Promise.resolve(sb.storage.from(ASSET_BUCKET).remove([p])).catch(function(){})}catch(e){}}}
function imgResize(f,mx,lim){return new Promise(function(ok,no){var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){var w=img.naturalWidth||mx,h=img.naturalHeight||mx,sc=Math.min(1,mx/w,mx/h),q=.86,out='';
    for(var i=0;i<8;i++){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=lim)break;sc*=.8;q=Math.max(.5,q-.08)}
    URL.revokeObjectURL(u);ok(out)};
  img.onerror=function(){URL.revokeObjectURL(u);no(new Error('Could not read that image.'))};img.src=u})}
function prodImgSet(id,url){var h=$('pp_'+id+'_i'),pv=$('pp_'+id+'_pv');if(h)h.value=url;if(pv)pv.innerHTML=url?'<img src="'+esc(url)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">':''}
async function prodImgPick(id,inp){var f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!/^image\//.test(f.type)){toast('Choose an image file.',false);return}
  try{toast('Uploading image\u2026',true);var d=await imgCrop(f,1200,4/3,500000),url=await brandUp('product',d);prodImgSet(id,url);toast('Image uploaded. Press Save on the product to keep it.',true)}
  catch(e){toast(upErr(e),false)}}
/* centre-crop to a fixed ratio (width/height), at most mx px wide, JPEG under lim characters */
function imgCrop(f,mx,ratio,lim){return new Promise(function(ok,no){var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight;if(!w||!h){URL.revokeObjectURL(u);no(new Error('Could not read that image.'));return}
    var sw=w,sh=w/ratio;if(sh>h){sh=h;sw=h*ratio}var sx=(w-sw)/2,sy=(h-sh)/2,ow=Math.min(mx,Math.round(sw)),q=.86,out='';
    for(var i=0;i<8;i++){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(ow));c.height=Math.max(1,Math.round(ow/ratio));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=lim)break;ow*=.8;q=Math.max(.5,q-.08)}
    URL.revokeObjectURL(u);ok(out)};
  img.onerror=function(){URL.revokeObjectURL(u);no(new Error('Could not read that image.'))};img.src=u})}
function upErr(e){var m=(e&&e.message)||String(e);
  if(/bucket not found/i.test(m))return 'Upload failed: the storage bucket does not exist yet. Run site-assets.sql in Supabase.';
  if(/row-level security|policy|unauthori[sz]ed|not allowed|jwt/i.test(m))return 'Upload failed: only a logged-in admin can upload. Log in as admin, and make sure site-assets.sql was run after xend-storefront.sql.';
  if(/mime|payload too large|exceeded/i.test(m))return 'Upload failed: image type or size not accepted ('+m+').';
  return 'Upload failed: '+m}
function assetPath(u){var m=String(u||'').match(/\/object\/public\/site-assets\/([^?#]+)$/);return m?decodeURIComponent(m[1]):''}
async function brandUp(kind,val){if(!/^data:/.test(val))return val;
  var m=val.match(/^data:(image\/[a-z+]+);/),ext={'image/webp':'webp','image/png':'png','image/jpeg':'jpg','image/gif':'gif'}[m&&m[1]]||'png';
  var blob=await (await fetch(val)).blob(),path=kind+'-'+Date.now().toString(36)+'.'+ext;
  var r=await sb.storage.from(ASSET_BUCKET).upload(path,blob,{contentType:m?m[1]:'image/png',cacheControl:'31536000',upsert:false});
  if(r.error)throw new Error(r.error.message);
  return sb.storage.from(ASSET_BUCKET).getPublicUrl(path).data.publicUrl}
async function brandSave(){brandSync();var d=brandDraft,prev=FX.brand||{};
  if(d.bl&&!xlink(d.bl)){toast('The banner link is not valid.',false);return}
  var lg='',bn='';
  try{if(/^data:/.test(d.logo||'')||/^data:/.test(d.bn||''))toast('Uploading\u2026',true);
    lg=okData(d.logo)?await brandUp('logo',d.logo):'';bn=okData(d.bn)?await brandUp('banner',d.bn):''}
  catch(e){toast(upErr(e),false);return}
  var o={lp:d.lp||'header',ls:d.ls||'m',logo:lg,bn:bn,ba:d.ba||'',bl:d.bl?xlink(d.bl):'',bp:d.bp||'top',bs:d.bs||'wide',bon:d.bon===0?0:1};
  if(await xCfgSave({brand:o},'brand')){
    [prev.logo,prev.bn].forEach(function(u){var p=assetPath(u);if(p&&u!==o.logo&&u!==o.bn){try{Promise.resolve(sb.storage.from(ASSET_BUCKET).remove([p])).catch(function(){})}catch(e){}}});
    brandDraft=null;render()}}

themeApply(FX.theme);

boot();
loadCms().then(function(){var ae=document.activeElement;if(!(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)))render()});
</script>
